name: syft-sbom-ci

on:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  syft-sbom:

    permissions:
      actions: write  # for anchore/sbom-action to upload workflow artifacts
      contents: write  # for anchore/sbom-action to upload & delete release assets
    runs-on: ubuntu-latest

    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
      with:
        egress-policy: audit

    - name: Checkout
      uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2.7.0
        
    - name: Anchore SBOM Action
      uses: anchore/sbom-action@b5042e9d19d8b32849779bfe17673ff84aec702d # v0.12.0
      with:
         artifact-name: ${{ github.event.repository.name }}-spdx.json

